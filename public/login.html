<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casino Masqué | Connexion</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
      .login-shell { display:flex; justify-content:center; align-items:flex-start; flex:1; padding:2rem 1rem; }
      .login-panel { width:100%; max-width:420px; }
      .logo-area { text-align:center; margin-bottom:2rem; }
      .logo-area h1 { font-size:2.2rem; margin-bottom:0.3rem; text-shadow:0 4px 20px rgba(212,175,55,.4); }
      .logo-area .subtitle { font-size:.85rem; color:var(--color-text-muted); text-transform:uppercase; letter-spacing:3px; font-family:var(--font-body); }
      .password-wrap { position:relative; }
      .password-wrap input { padding-right:3rem; }
      .toggle-password { position:absolute; right:.7rem; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--color-text-muted); cursor:pointer; padding:.3rem; font-size:1.2rem; display:flex; align-items:center; transition:color .2s; }
      .toggle-password:hover { color:var(--color-gold); }
      .auth-submit { width:100%; margin-top:.5rem; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>Casino Masqué</strong>
        <span>Bal 2026 · 18 Juillet</span>
      </div>
    </header>

    <main class="login-shell">
      <section class="panel login-panel">
        <div class="logo-area">
          <h1>Casino Masqué</h1>
          <div class="subtitle">Bal 2026 · 18 Juillet</div>
        </div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="login-email">Email ou identifiant</label>
            <input id="login-email" name="email" type="text" autocomplete="username" required placeholder="admin ou email@exemple.com">
          </div>
          <div class="field">
            <label for="login-password">Mot de passe</label>
            <div class="password-wrap">
              <input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="••••••••">
              <button type="button" class="toggle-password" aria-label="Afficher le mot de passe" data-target="login-password">
                <i class="ti ti-eye"></i>
              </button>
            </div>
          </div>
          <button class="primary auth-submit" type="submit">Se connecter</button>
          <div id="loginMessage" class="message" hidden></div>
        </form>
      </section>
    </main>

    <script src="/assets/app.js"></script>
    <script>
      (function () {
        'use strict';
        const session = sessionStorage.getItem('casinoSession');
        if (session) {
          try {
            const parsed = JSON.parse(session);
            if (parsed && parsed.role === 'admin')      { window.location.href = '/admin.html'; return; }
            if (parsed && parsed.role === 'controleur') { window.location.href = '/scan.html';  return; }
          } catch (_) {}
        }

        document.querySelector('.toggle-password').addEventListener('click', function () {
          const input = document.getElementById(this.dataset.target);
          const icon  = this.querySelector('i');
          if (input.type === 'password') { input.type = 'text'; icon.className = 'ti ti-eye-off'; }
          else                           { input.type = 'password'; icon.className = 'ti ti-eye'; }
        });

        const loginMsg = document.getElementById('loginMessage');
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
          e.preventDefault();
          loginMsg.hidden = true;
          const email    = this.querySelector('[name="email"]').value.trim();
          const password = this.querySelector('[name="password"]').value;
          const btn      = this.querySelector('button[type="submit"]');
          btn.disabled   = true; btn.textContent = 'Connexion…';
          try {
            const result = await window.ticketApi.login({ email, password });
            const role   = result.user?.role || '';
            sessionStorage.setItem('casinoSession', JSON.stringify({ role, nom: result.user?.nom || '', token: result.token || '' }));
            if (role === 'admin')      window.location.href = '/admin.html';
            else if (role === 'controleur') window.location.href = '/scan.html';
            else { loginMsg.textContent = 'Rôle non reconnu.'; loginMsg.className = 'message error'; loginMsg.hidden = false; }
          } catch (err) {
            loginMsg.textContent = err.message || 'Identifiants invalides.';
            loginMsg.className   = 'message error';
            loginMsg.hidden      = false;
          } finally {
            btn.disabled = false; btn.textContent = 'Se connecter';
          }
        });
      })();
    </script>
  </body>
</html>

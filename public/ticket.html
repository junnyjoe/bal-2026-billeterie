<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket | Bal 2026</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>Bal 2026</strong>
        <span>Ticket participant</span>
      </div>
      <nav class="nav" aria-label="Navigation principale">
        <a href="/index.html">Inscription</a>
        <a href="/login.html">Connexion</a>
        <a href="/admin.html">Admin</a>
        <a href="/scan.html">Scan</a>
      </nav>
    </header>

    <main class="shell">
      <section id="ticketView"></section>
      <div class="actions">
        <button type="button" onclick="window.print()">Imprimer</button>
        <a class="button" href="/index.html">Nouveau participant</a>
      </div>
      <div id="ticketMessage" class="message" hidden></div>
    </main>

    <script src="/assets/app.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const ticketView = document.querySelector('#ticketView');
      const message = document.querySelector('#ticketMessage');

      async function loadTicket() {
        if (!code) {
          window.ticketUi.showMessage(message, 'Code ticket manquant.', 'error');
          return;
        }

        try {
          const result = await window.ticketApi.getTicket(code);
          window.ticketUi.renderTicket(result.ticket, ticketView);
        } catch (error) {
          window.ticketUi.showMessage(message, error.message, 'error');
        }
      }

      loadTicket();
    </script>
  </body>
</html>
